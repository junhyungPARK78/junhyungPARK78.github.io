        <rect width="640" height="340" fill="#101116"/>
        <text x="20" y="26" font-size="12.5" fill="#e8b33a">인디의 대사에서 철자를 확인 → 그 글자 타일만 밟는다</text>
        <rect x="20" y="36" width="600" height="26" rx="4" fill="#1a1a1f"/>
        <text x="32" y="54" font-size="12" fill="#cfd3da">"In Tuskin, Jehovah is spelled <tspan fill="#e8b33a">JEHOBA</tspan>."  ← 회차마다 IEHOVA / JEHUVA 등으로 달라짐</text>
        <g font-size="13" text-anchor="middle">
          <!-- row1 -->
