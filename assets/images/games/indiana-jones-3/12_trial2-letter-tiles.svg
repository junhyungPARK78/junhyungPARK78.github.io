        <path d="M114 142 L218 142 L166 188 L270 188 L218 234 L322 234" stroke="#e8b33a" stroke-width="3" fill="none" stroke-linejoin="round"/>
        <circle cx="114" cy="142" r="6" fill="#e8b33a"/><circle cx="322" cy="234" r="6" fill="#e8b33a"/>
        <text x="392" y="100" font-size="12.5" fill="#e8b33a">규칙</text>
        <text x="392" y="126" font-size="12" fill="#cfd3da">• 철자에 있는 글자 타일만 밟는다</text>
        <text x="392" y="150" font-size="12" fill="#cfd3da">• <tspan fill="#e2686a">타일을 건너뛸 수 없다</tspan> — 인접 이동만</text>
        <text x="392" y="174" font-size="12" fill="#cfd3da">• 같은 글자가 여러 곳이면 이어지는 쪽</text>
        <text x="392" y="198" font-size="12" fill="#cfd3da">• 안전한 칸마다 세이브 (ScummVM)</text>
        <text x="392" y="222" font-size="12" fill="#cfd3da">• 잘못 밟으면 즉사 → 1관문부터</text>
        <rect x="20" y="276" width="600" height="52" rx="8" fill="#16171c" stroke="#33363f"/>
        <text x="34" y="298" font-size="12" fill="#9aa0ab">※ 위 격자는 <tspan font-weight="700">규칙 설명용 예시</tspan>다. 실제 배열·철자는 회차마다 다르므로</text>
        <text x="34" y="318" font-size="12" fill="#9aa0ab">   원본 스샷의 1~22 경로를 따라해도 맞지 않는다.</text>
      </svg>
